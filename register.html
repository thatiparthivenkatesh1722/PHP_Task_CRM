<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | WorkSphere CRM</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --g1: #11998e;
      --g2: #38ef7d;
      --bg: #0d0f18;
      --card: #161923;
      --bdr: rgba(255, 255, 255, 0.07);
      --tx: #e2e8f0;
      --mu: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: var(--bg);
      color: var(--tx);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .auth-card {
      background: var(--card);
      border: 1px solid var(--bdr);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      padding: 40px;
      width: 100%;
      max-width: 580px;
    }

    .auth-icon {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 28px;
      margin: 0 auto 20px;
    }

    .auth-title {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
      text-align: center;
    }

    .auth-subtitle {
      font-size: 14px;
      color: var(--mu);
      text-align: center;
      margin-bottom: 30px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--mu);
      margin-bottom: 6px;
      display: block;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--bdr);
      color: var(--tx);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--g1);
      box-shadow: 0 0 0 3px rgba(17, 153, 142, .15);
      color: var(--tx);
    }

    .form-control::placeholder {
      color: var(--mu);
    }

    .btn-auth {
      background: linear-gradient(135deg, var(--g1), var(--g2));
      color: #fff;
      border: none;
      padding: 12px;
      font-weight: 700;
      border-radius: 12px;
      width: 100%;
      transition: 0.2s;
    }

    .btn-auth:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .error {
      font-size: 11px;
      margin-top: 4px;
      display: block;
    }
  </style>
</head>

<body>

  <div class="auth-card">
    <div class="auth-icon"><i class="bi bi-person-plus"></i></div>
    <h3 class="auth-title">Create Account</h3>
    <p class="auth-subtitle">Join WorkSphere and start managing easily.</p>

    <form id="registerForm">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label>First Name</label>
          <input type="text" id="firstName" class="form-control" placeholder="Enter first name">
          <small class="error text-danger"></small>
        </div>

        <div class="col-md-6 mb-3">
          <label>Last Name</label>
          <input type="text" id="lastName" class="form-control" placeholder="Enter last name">
          <small class="error text-danger"></small>
        </div>
      </div>

      <div class="mb-3">
        <label>Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="user@example.com">
        <small class="error text-danger"></small>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Phone Number</label>
          <input type="text" id="phone" class="form-control" placeholder="10-digit number">
          <small class="error text-danger"></small>
        </div>

        <div class="col-md-6 mb-3">
          <label>Date of Birth</label>
          <input type="date" id="dob" class="form-control" style="color: var(--mu);">
          <small class="error text-danger"></small>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label>PAN Card</label>
          <input type="text" id="pan" class="form-control" placeholder="Enter PAN number">
          <small class="error text-danger"></small>
        </div>

        <div class="col-md-6 mb-4">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="Create a password">
          <small class="error text-danger"></small>
        </div>
      </div>

      <button type="submit" class="btn-auth">
        Register Account <i class="bi bi-check2 ms-1"></i>
      </button>

      <p class="mt-4 text-center" style="font-size: 13px; color: var(--mu);">
        Already have an account?
        <a href="login.html" style="color: var(--g2); text-decoration: none; font-weight: 600;">Login here</a>
      </p>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./JS/register.js"></script>
  <script>
    // Small trick to make date input text grey until user selects a date
    $('#dob').on('change', function () {
      if ($(this).val()) {
        $(this).css('color', 'var(--tx)');
      } else {
        $(this).css('color', 'var(--mu)');
      }
    });
  </script>

</body>

</html>
