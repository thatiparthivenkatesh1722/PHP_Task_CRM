<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

     <style>
         body {
  min-height: 100vh;
  background: linear-gradient(135deg, #eef7ff, #e9fff4);
 
}

.auth-card {
  background: #ffffff;
  border: none;
  border-radius: 24px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
}

.auth-icon {
  font-size: 4rem;
  color: #11998e;
}

.auth-title {
  color: #11998e;
  font-weight: 800;
}
.auth-subtitle {
  font-size: 14px;
  color: #64748b;
  margin-bottom: 20px;
}

.btn-auth {
  background: linear-gradient(135deg, #11998e, #38ef7d);
  color: #fff;
  border: none;
  padding: 12px;
  font-weight: 700;
  border-radius: 12px;
}

.btn-auth:hover {
  opacity: 0.9;
  color: #fff;
}

.form-control {
  border-radius: 12px;
  padding: 11px;
}

.error {
  font-size: 13px;
}
     </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card auth-card col-11 col-sm-10 col-md-8 col-lg-6 col-xl-4 p-4 m-5">
           <div class="text-center mb-4">
                <i class="bi bi-person-plus auth-icon"></i>
                <h3 class="auth-title mt-3">Create Account</h3>
                <p class="auth-subtitle">Create your account 🚀</p>
            </div>

            <form id="registerForm">

                <div class="row">
                    <div class="col-md-6 mb-2">
                    <label>First Name</label>
                    <input type="text" id="firstName" class="form-control" placeholder="Enter First Name">
                    <small class="error text-danger"></small>
                    </div>

                    <div class="col-md-6 mb-2">
                    <label>Last Name</label>
                    <input type="text" id="lastName" class="form-control" placeholder="Enter Last Name">
                    <small class="error text-danger"></small>
                    </div>
                </div>

                <div class="mb-2">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter Email">
                    <small class="error text-danger"></small>
                </div>
               <div class="row">
                <div class=" col-md-6 mb-2">
                    <label>Phone</label>
                    <input type="text" id="phone" class="form-control" placeholder="Enter Phone">
                    <small class="error text-danger"></small>
                </div>

                <div class="col-md-6 mb-2">
                    <label>Date of Birth</label>
                    <input type="date" id="dob" class="form-control">
                    <small class="error text-danger"></small>
                </div>
               </div>
               <div class="row">
                <div class="col-md-6 mb-2">
                    <label>PAN</label>
                    <input type="text" id="pan" class="form-control" placeholder="Enter PAN number">
                    <small class="error text-danger"></small>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter Password">
                    <small class="error text-danger"></small>
                </div>
             </div>
                <button type="submit" class="btn btn-success btn-register w-100"> <i class="bi bi-person-plus me-2"></i>Register</button>

                <p class="mt-3 text-center">
                    Already have an account?
                    <a href="login.html" class="text-primary fw-bold text-decoration-none">Login</a>
                </p>

             </form>

        </div>

    </div>

     <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./JS/register.js"></script>
    
</body>
</html>
